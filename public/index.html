      .action-buttons { width: 100%; justify-content: flex-end; }
      .link-card { flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>
<body>
<div class="container">
  <h1>📦 Pastebin Pro</h1>
  <div class="sub">smart folders · instant sharing · local-first memory</div>

  <div class="toolbar">
    <button onclick="toggleTheme()">🌓 Light / Dark</button>
    <button onclick="exportAllData()">💾 Export JSON</button>
    <button onclick="importDataDialog()">📂 Import Backup</button>
    <button onclick="clearAllPastes(true)">🗑️ Clear All Data</button>
  </div>

  <!-- CREATE SECTION -->
  <div class="card">
    <div class="input-group">
      <label>📌 Title</label>
      <input id="title" type="text" placeholder="e.g., QuickSort in Python" autocomplete="off">
    </div>
    <div class="input-group">
      <label>🗂️ Folder name</label>
      <input id="folder" placeholder="e.g., Algorithms, React, Bash" list="folderSuggestions">
      <datalist id="folderSuggestions"></datalist>
    </div>
    <div class="input-group">
      <label>✏️ Code / Content</label>
      <textarea id="content" placeholder="Paste your code, notes, or snippet here..."></textarea>
    </div>
    <button class="save-btn" id="saveBtn" onclick="createPaste()">✨ Create Paste</button>
    <div id="link" style="margin-top: 12px;"></div>
  </div>

  <hr>

  <div style="display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap;">
    <h2>📂 Your Knowledge Base</h2>
    <button onclick="loadPastes()" class="small-btn">🔄 Refresh</button>
  </div>
  <div id="list" style="margin-top: 16px;"></div>
</div>

<div id="toastMsg" class="toast">✔️ Copied!</div>

<script>
  // ---------- STORAGE ENGINE (mock backend in localStorage) ----------
  const STORAGE_KEY = "pastebin_pro_data";
  let pastes = [];     // each: { id, title, content, folder, createdAt, updatedAt }

  // Helper: generate short readable ID (timestamp + random)
  function generateId() {
    return Date.now().toString(36) + '-' + Math.random().toString(36).substring(2, 6);
  }

  function loadFromStorage() {
    const stored = localStorage.getItem(STORAGE_KEY);
    if (stored) {
      try {
        pastes = JSON.parse(stored);
      } catch(e) { pastes = []; }
    }
    if (!pastes || !Array.isArray(pastes)) pastes = [];
    // ensure backward compatibility: add timestamps if missing
    pastes = pastes.map(p => ({
      ...p,
      createdAt: p.createdAt || p.id.split('-')[0] || Date.now(),
      updatedAt: p.updatedAt || Date.now()
    }));
    saveToStorage();
  }

  function saveToStorage() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(pastes));
    updateFolderSuggestions();
  }

  function updateFolderSuggestions() {
    const foldersSet = new Set();
    pastes.forEach(p => { if(p.folder && p.folder.trim()) foldersSet.add(p.folder.trim()); });
    const datalist = document.getElementById("folderSuggestions");
    if(datalist) {
      datalist.innerHTML = "";
      Array.from(foldersSet).sort().forEach(f => {
        const opt = document.createElement("option");
        opt.value = f;
        datalist.appendChild(opt);
      });
    }
  }

  // Helper to format relative time
  function formatDate(timestamp) {
    if(!timestamp) return "recent";
    const date = new Date(timestamp);
    return date.toLocaleDateString(undefined, { month:'short', day:'numeric', hour:'2-digit', minute:'2-digit' });
  }

  function showToast(msg, isError = false) {
    const toast = document.getElementById("toastMsg");
    toast.style.opacity = "1";
    toast.style.borderLeftColor = isError ? "#f87171" : "#4ade80";
    toast.innerText = msg;
    setTimeout(() => { toast.style.opacity = "0"; }, 2000);
  }

  // API simulation endpoints (replaces fetch)
  async function createPaste() {
    const title = document.getElementById("title").value.trim();
    let content = document.getElementById("content").value;
    let folder = document.getElementById("folder").value.trim();

    if (!content) {
      showToast("❌ Paste content cannot be empty", true);
      return;
    }
    if (!folder) folder = "Uncategorized";
    const finalTitle = title || "Untitled snippet";

    const newPaste = {
      id: generateId(),
      title: finalTitle,
      content: content,
      folder: folder,
      createdAt: Date.now(),
      updatedAt: Date.now()
    };
    pastes.unshift(newPaste);  // newest first
    saveToStorage();

    // clear form except keep folder maybe
    document.getElementById("title").value = "";
    document.getElementById("content").value = "";
    // keep folder field for quick consecutive pastes? optionally reset? not resetting folder for better UX
    document.getElementById("folder").value = folder;
    
    const url = window.location.origin + window.location.pathname + "#paste/" + newPaste.id;
    const linkDiv = document.getElementById("link");
    linkDiv.innerHTML = `
      <div class="link-card">
        <span>✅ Saved! </span>
        <a href="${url}" target="_blank">🔗 ${finalTitle} — open paste</a>
        <button class="small-btn" onclick="copyToClipboard('${url}')">📋 Copy link</button>
      </div>
    `;
    showToast(`✨ "${finalTitle}" saved in ${folder}`);
    loadPastes();  // refresh list
    setTimeout(() => {
      if(linkDiv.innerHTML.includes("Saved")) {
        setTimeout(() => { if(linkDiv.firstChild) linkDiv.innerHTML = ""; }, 4000);
      }
    }, 3500);
  }

  // delete paste by id
  function deletePaste(id, event) {
    if(event) event.stopPropagation();
    if(confirm("Delete this paste permanently?")) {
      pastes = pastes.filter(p => p.id !== id);
      saveToStorage();
      loadPastes();
      showToast("🗑️ Paste deleted");
    }
  }

  // copy raw content to clipboard
  function copyContent(content, title) {
    navigator.clipboard.writeText(content);
    showToast(`📋 Copied "${title || 'snippet'}" content`);
  }

  function copyToClipboard(text) {
    navigator.clipboard.writeText(text);
    showToast("🔗 Link copied to clipboard");
  }

  // render folder group + pastes
  function loadPastes() {
    const container = document.getElementById("list");
    if (!pastes.length) {
      container.innerHTML = `<div class="empty-state">📭 No pastes yet. Create your first snippet above! ✨</div>`;
      return;
    }

    // group by folder
    const grouped = new Map();
    pastes.forEach(p => {
      const folderName = p.folder || "Uncategorized";
      if (!grouped.has(folderName)) grouped.set(folderName, []);
      grouped.get(folderName).push(p);
    });

    // sort folders alphabetically, but keep "Uncategorized" maybe last
    let sortedFolders = Array.from(grouped.keys()).sort((a,b) => {
      if(a === "Uncategorized") return 1;
      if(b === "Uncategorized") return -1;
      return a.localeCompare(b);
    });

    container.innerHTML = "";
    for(let folder of sortedFolders) {
      const pastesInFolder = grouped.get(folder);
      // folder header with open virtual folder link
      const folderUrl = window.location.origin + window.location.pathname + `?folder=${encodeURIComponent(folder)}`;
      const folderSection = document.createElement("div");
      folderSection.className = "folder-header";
      folderSection.innerHTML = `
        <div style="display: flex; gap: 12px; align-items: baseline;">
          <h3 style="display: flex; gap: 8px;">📁 ${escapeHtml(folder)} <span class="folder-badge">${pastesInFolder.length}</span></h3>
          <a href="${folderUrl}" target="_blank" style="font-size: 0.75rem; color: var(--accent);">🔗 open folder view</a>
        </div>
      `;
      container.appendChild(folderSection);
      
      pastesInFolder.forEach(p => {
        const pasteDiv = document.createElement("div");
        pasteDiv.className = "paste-item";
        const previewContent = p.content.length > 70 ? p.content.substring(0, 70) + "…" : p.content;
        pasteDiv.innerHTML = `
          <div class="paste-info">
            <div class="paste-title">📄 ${escapeHtml(p.title)}</div>
            <div class="paste-meta">🕒 ${formatDate(p.createdAt)} · ✏️ ${p.content.length} chars · in ${escapeHtml(p.folder)}</div>
            <div class="paste-meta" style="font-family: monospace; font-size:0.7rem; opacity:0.7;">${escapeHtml(previewContent)}</div>
          </div>
          <div class="action-buttons">
            <button class="small-btn" onclick="viewPasteModal('${p.id}')">🔍 View</button>
            <button class="small-btn" onclick="copyContent(\`${escapeJsString(p.content)}\`, \`${escapeJsString(p.title)}\`)">📋 Copy</button>
            <button class="small-btn" onclick="copyToClipboard('${window.location.origin}${window.location.pathname}#paste/${p.id}')">🔗 Link</button>
            <button class="small-btn delete-btn" onclick="deletePaste('${p.id}', event)">🗑️ Del</button>
          </div>
        `;
        container.appendChild(pasteDiv);
      });
    }
  }

  // helper: view in modal / detail view
  function viewPasteModal(id) {
    const paste = pastes.find(p => p.id === id);
    if(!paste) return;
    const modalHtml = `
      <div id="pasteModal" style="position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); backdrop-filter: blur(4px); display:flex; align-items:center; justify-content:center; z-index:2000;">
        <div style="background:var(--surface); max-width: 700px; width:90%; border-radius: 32px; padding: 1.8rem; box-shadow: 0 20px 35px rgba(0,0,0,0.3); border:1px solid var(--border);">
          <div style="display:flex; justify-content:space-between;">
            <h3>📄 ${escapeHtml(paste.title)} <span style="font-size:0.7rem;">[${escapeHtml(paste.folder)}]</span></h3>
            <button onclick="closeModal()" style="background:none; border:none; font-size:1.8rem; cursor:pointer;">&times;</button>
          </div>
          <pre style="background:var(--bg); padding:1rem; border-radius: 16px; overflow-x: auto; font-family: monospace; font-size:0.85rem; margin: 16px 0; white-space: pre-wrap; word-break: break-word;">${escapeHtml(paste.content)}</pre>
          <div style="display:flex; gap: 12px; justify-content: flex-end;">
            <button class="small-btn" onclick="copyContent(\`${escapeJsString(paste.content)}\`, \`${escapeJsString(paste.title)}\`); closeModal();">📋 Copy Content</button>
            <button class="small-btn" onclick="closeModal()">Close</button>
          </div>
        </div>
      </div>
    `;
    document.body.insertAdjacentHTML('beforeend', modalHtml);
  }

  window.closeModal = function() {
    const modal = document.getElementById("pasteModal");
    if(modal) modal.remove();
  };

  // Export all pastes as JSON file
  function exportAllData() {
    const dataStr = JSON.stringify({ pastes, version: "1.0", exportedAt: new Date().toISOString() }, null, 2);
    const blob = new Blob([dataStr], {type: "application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `pastebin_pro_backup_${new Date().toISOString().slice(0,19)}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast("💾 Exported all pastes");
  }

  function importDataDialog() {
    const input = document.createElement("input");
    input.type = "file";
    input.accept = "application/json";
    input.onchange = (e) => {
      const file = e.target.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        try {
          const imported = JSON.parse(ev.target.result);
          if(imported.pastes && Array.isArray(imported.pastes)) {
            if(confirm(`Import ${imported.pastes.length} pastes? This will REPLACE all current data.`)) {
              pastes = imported.pastes.map(p => ({
                ...p,
                id: p.id || generateId(),
                updatedAt: Date.now()
              }));
              saveToStorage();
              loadPastes();
              showToast(`✅ Imported ${pastes.length} pastes`);
            }
          } else {
            showToast("Invalid backup file format", true);
          }
        } catch(err) { showToast("Failed to parse JSON", true); }
      };
      reader.readAsText(file);
    };
    input.click();
  }

  function clearAllPastes(confirmRequired = true) {
    if(confirmRequired && !confirm("⚠️ Delete ALL pastes permanently? This cannot be undone.")) return;
    pastes = [];
    saveToStorage();
    loadPastes();
    document.getElementById("link").innerHTML = "";
    showToast("🗑️ All pastes cleared");
  }

  // Helper: escape HTML to avoid injection
  function escapeHtml(str) {
    if(!str) return "";
    return str.replace(/[&<>]/g, function(m) {
      if(m === '&') return '&amp;';
      if(m === '<') return '&lt;';
      if(m === '>') return '&gt;';
      return m;
    }).replace(/[\uD800-\uDBFF][\uDC00-\uDFFF]/g, function(c) {
      return c;
    });
  }

  function escapeJsString(str) {
    if(!str) return "";
    return str.replace(/\\/g, '\\\\').replace(/`/g, '\\`').replace(/\$/g, '\\$');
  }

  // Theme toggling with persistence
  function toggleTheme() {
    document.body.classList.toggle("light");
    const isLight = document.body.classList.contains("light");
    localStorage.setItem("pastebin_theme", isLight ? "light" : "dark");
  }

  function loadThemePreference() {
    const savedTheme = localStorage.getItem("pastebin_theme");
    if(savedTheme === "light") {
      document.body.classList.add("light");
    } else if(savedTheme === "dark") {
      document.body.classList.remove("light");
    } else {
      // default dark
      document.body.classList.remove("light");
    }
  }

  // router: if hash #paste/id or query folder highlight 
  function handleRouting() {
    const hash = window.location.hash;
    if(hash.startsWith("#paste/")) {
      const id = hash.split("#paste/")[1];
      const paste = pastes.find(p => p.id === id);
      if(paste) {
        setTimeout(() => {
          viewPasteModal(paste.id);
        }, 150);
      } else if(pastes.length && id) {
        showToast("Paste not found", true);
      }
    }
    const urlParams = new URLSearchParams(window.location.search);
    const folderParam = urlParams.get("folder");
    if(folderParam && pastes.length) {
      showToast(`📂 Filtering view for "${folderParam}" — but all pastes are grouped below. Scroll to folder.`, false);
      setTimeout(() => {
        const headers = document.querySelectorAll(".folder-header h3");
        for(let h of headers) {
          if(h.innerText.includes(folderParam)) {
            h.scrollIntoView({ behavior: "smooth", block: "center" });
            break;
          }
        }
      }, 200);
    }
  }

  // expose to global for onclick
  window.createPaste = createPaste;
  window.toggleTheme = toggleTheme;
  window.loadPastes = loadPastes;
  window.copyToClipboard = copyToClipboard;
  window.copyContent = copyContent;
  window.deletePaste = deletePaste;
  window.viewPasteModal = viewPasteModal;
  window.exportAllData = exportAllData;
  window.importDataDialog = importDataDialog;
  window.clearAllPastes = clearAllPastes;
  
  // init
  loadFromStorage();
  loadThemePreference();
  loadPastes();
  handleRouting();
  window.addEventListener("hashchange", () => { handleRouting(); });
  // add small helper for folder suggestion update after mutation
</script>
</body>
</html>
